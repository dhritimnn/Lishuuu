    <style>
    	@keyframes fadeDown {
    		from { opacity: 0; transform: translateY(-12px); }
    		to { opacity: 1; transform: translateY(0); }
    	}
    	@keyframes fadeUp {
    		from { opacity: 0; transform: translateY(16px); }
    		to { opacity: 1; transform: translateY(0); }
    	}
    	@keyframes glow {
    		0%, 100% { background-position: 0% 50%; }
    		50% { background-position: 100% 50%; }
    	}
    	@keyframes pulseSoft {
    		0%, 100% { opacity: 1; }
    		50% { opacity: .55; }
    	}
    	@keyframes slideUpIn {
    		from { opacity: 0; transform: translateY(18px); filter: blur(3px); }
    		to { opacity: 1; transform: translateY(0); filter: blur(0); }
    	}
    	@keyframes fadeOutUp {
    		from { opacity: 1; transform: translateY(0); }

    	nav {

    	}
    	nav h2:hover {

    		letter-spacing: .28rem;
    		opacity: .85;
    	}

    	nav p {
    		animation: pulseSoft 2.6s ease-in-out infinite;
    	}

    	#first, #second {
    		will-change: transform, opacity, filter;
    	}

    	#first.leaving, #second.leaving {
    		animation: fadeOutUp 150ms ease both;
    	}
    	#first.entering, #second.entering {
    		animation: slideUpIn 380ms cubic-bezier(.22,1,.36,1) both;
    	}
    	#second.entering {
    		animation-delay: 0ms;
    	}

    	.tap-zone {
    		transition: background-color .15s ease;
    	}
    	.tap-zone:active {

    	}

    	section {

	 	const queryString = window.location.search;
	 	const params = new URLSearchParams(queryString);
	 	const p_val = params.get('song');

	 	function render(){

	 	const song = songs[p_val]

        const first = document.querySelector("#first");
	 	const second = document.querySelector("#second");
	 	document.querySelector("nav").style.backgroundColor = song[0]
	 	document.querySelector("body").style.backgroundColor = song[1]
		let i = 2;
	 	first.innerHTML = song[2]
	 	second.innerHTML = song[3]

	 	let isAnimating = false;

	 	function playTransition(newFirst, newSecond){
	 		if (isAnimating) return;
	 		isAnimating = true;

	 		first.classList.add("leaving");
	 		second.classList.add("leaving");

	 		setTimeout(function(){
	 			first.innerHTML = newFirst;
	 			second.innerHTML = newSecond;

	 			first.classList.remove("leaving");
	 			second.classList.remove("leaving");

	 			// force reflow so the browser commits the class removal
	 			// before "entering" is added, otherwise the delayed
	 			// (staggered) second-line animation can visually stutter
	 			void first.offsetWidth;
	 			void second.offsetWidth;

	 			first.classList.add("entering");
	 			second.classList.add("entering");

	 			setTimeout(function(){
	 				first.classList.remove("entering");
	 				second.classList.remove("entering");
	 				isAnimating = false;
	 			}, 440);
	 		}, 150);
	 	}

	 	function forwards(){
	 	if (i>=song.length-2) return;
			i++
			playTransition(song[i], song[i+1])
	 	}
	 	function backwards(){
            if (i<=2) return;
			i--
			playTransition(song[i], song[i+1])
	 	}

window.forwards = forwards;
window.backwards = backwards;
